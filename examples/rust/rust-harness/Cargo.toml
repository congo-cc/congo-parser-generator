# The test and benchmark harness for the Rust parser that CongoCC generates
# from examples/rust/Rust.ccc.  The parser crate is generated into
# ../rust-rustparser by `ant rust-gen` (see ../build.xml).
[package]
name = "rust-harness"
version = "0.1.0"
edition = "2024"
description = "Compares the Rust parser generated by CongoCC from Rust.ccc with the generated Java parser"
publish = false

[dependencies]
org-parsers-rust = { path = "../rust-rustparser" }

[profile.release]
# The benchmark compares optimized code: Java's JIT inlines across the whole
# parser, so the Rust build may optimize across crates as well.
lto = true
codegen-units = 1
